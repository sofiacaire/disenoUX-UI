<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9 - Flexbox: galería de tarjetas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Nuestros productos</h1>
    <div class="galeria">
        <article class="producto">
            <img src="img/remeras.jpeg" alt="Remeras deportivas manga corta">
            <h3>Remeras deportivas</h3>
            <p class="precio">$14.000</p>
            <button>Agregar al carrito</button>
        </article>
        <article class="producto">
            <img src="img/calzacorta.jpeg" alt="Calzas cortas deportivas">
            <h3>Calzas cortas</h3>
            <p class="precio">$9.500</p>
            <button>Agregar al carrito</button>
        </article>
        <article class="producto">
            <img src="img/rompevientos.jpeg" alt="Camperas rompevientos">
            <h3>Camperas rompevientos</h3>
            <p class="precio">$25.000</p>
            <button>Agregar al carrito</button>
        </article>
        <article class="producto">
            <img src="img/short.jpeg" alt="Short con calza">
            <h3>Shorts con calza</h3>
            <p class="precio">$16.000</p>
            <button>Agregar al carrito</button>
        </article>
        <article class="producto">
            <img src="img/top.jpeg" alt="Top deportivo">
            <h3>Tops deportivos</h3>
            <p class="precio">$8.000</p>
            <button>Agregar al carrito</button>
        </article>
        <article class="producto">
            <img src="img/camperalycra.jpeg" alt="Camperas de lycra">
            <h3>Camperas lycra</h3>
            <p class="precio">$22.000</p>
            <button>Agregar al carrito</button>
        </article>
    </div>
</body>

</html>
