<!DOCTYPE html>
<html lang="es">

<body>
    <h1>Horario de clases en Escuela n° 117</h1>

                <th>Hora</th>

                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>08:00 - 08:40</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>4° A</td>
                <td>5° A</td>

            <tr>
                <td>08:50 - 09:25</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>2° A</td>

            <tr>
                <td>09:40 - 10:15</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>5° A</td>

            </tr>
            <tr>
                <td>10:25 - 11:10</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>6° B</td>
                <td>4° A</td>

                <td>11:15 - 12:00</td>
                <td>-</td>

                <td>-</td>

                <td>1° A</td>

        </tbody>
        <tfoot>
            <tr>
                <td colspan="6">6° A y B se alternan una semana cada uno los viernes</td>
            </tr>
        </tfoot>
    </table>

</html>
