<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17 - Menú hamburguesa (solo CSS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Cinzel&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="layout">
        <header class="header">
            <div class="marca">
                <span class="nombre-marca">Sofía</span>
                <span class="tipo-marca">Indumentaria Deportiva</span>
            </div>

            <!-- Menú de la derecha, visible solo en desktop -->
            <nav class="menu-derecha">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Productos</a></li>
                    <li><a href="#">Ubicación</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>

            <!-- Checkbox oculto que controla el estado abierto/cerrado -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle">

            <!-- Label asociado al checkbox: actúa como botón hamburguesa -->
            <label for="menu-toggle" class="menu-icono" aria-label="Abrir menú de navegación">
                <span></span>
                <span></span>
                <span></span>
            </label>
        </header>

        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Productos</a></li>
                    <li><a href="#">Ubicación</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>
        </aside>

        <main class="contenido">
            <h1>Descripción</h1>
            <p>Venta de ropa deportiva femenina.</p>
            <p>Trabajamos con cita previa.</p>
            <p>Aceptamos todos los medios de pago</p>
        </main>

        <footer class="footer">&copy; 2026</footer>
    </div>
</body>

</html>
